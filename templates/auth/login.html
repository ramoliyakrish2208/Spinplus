{% extends "base.html" %}
{% block title %}Sign In — Spin & Win Platform{% endblock %}

{% block content %}
<div
    style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg-main);">
    <div class="bento-card bento-feature" style="width:100%;max-width:420px;padding:36px 32px;text-align:center;">
        <div
            style="width:56px;height:56px;border-radius:var(--radius-md);background:linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 16px;box-shadow:0 6px 20px rgba(109,40,217,0.35);">
            <i data-lucide="disc-3" style="width:32px;height:32px;"></i>
        </div>

        <h1 style="font-size:1.6rem;font-weight:800;margin:0 0 4px 0;color:var(--text-primary);letter-spacing:-0.4px;">
            Spin & Win SaaS</h1>
        <p style="font-size:0.85rem;color:var(--text-muted);margin:0 0 24px 0;">Sign in to your shop owner or platform
            admin dashboard.</p>

        {% if error %}
        <div
            style="background:var(--color-danger-bg);border:1px solid rgba(239,68,68,0.35);color:var(--color-danger);padding:12px 16px;border-radius:var(--radius-md);font-size:0.85rem;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
            <i data-lucide="alert-circle" style="width:16px;height:16px;"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" style="text-align:left;">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="usernameInput" name="username" required class="form-input"
                    placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="passwordInput" name="password" required class="form-input"
                    placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">
                Sign In to Command Center →
            </button>
        </form>
    </div>
</div>
{% endblock %}

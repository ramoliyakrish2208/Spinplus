# ==============================================================================
# SpinPlus Django SaaS — Production Nginx Configuration (Ubuntu 22.04 LTS)
# ==============================================================================
# Installation Path: /etc/nginx/sites-available/spinplus
# Symlink Path:      /etc/nginx/sites-enabled/spinplus
# ==============================================================================

# Upstream Gunicorn WSGI Server (Private Loopback)
upstream spinplus_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- STAGE 1: HTTP (PORT 80) SERVER BLOCK ---
# Serves initial HTTP requests, static/media, and Let's Encrypt Certbot challenges.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 10M;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Security Guard: Block access to .env, .git, sqlite3 databases, scripts & secrets
    location ~* (^|/)(\.git|\.env|db\.sqlite3|\.sqlite3|.*\.py|.*\.sh|.*\.log|secrets) {
        deny all;
        return 404;
    }

    # Static Assets (Pre-collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/spinplus/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # User-Uploaded Media (Isolated directory; code execution forbidden)
    location /media/ {
        alias /var/www/spinplus/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;

        # Hardened Media Security: Deny execution of any code/script in uploads
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|bin|exe|bat|js|html)$ {
            deny all;
            return 403;
        }
    }

    # Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://spinplus_backend;
        proxy_http_version 1.1;

        # Preserve client headers for Django security & rate limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout & Buffer Hardening
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}

